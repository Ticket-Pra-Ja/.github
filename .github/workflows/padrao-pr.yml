# Valida se o PR segue o padrão da Ticket Pra Já.
# Reutilizável: só roda quando um repositório o chama (ver workflow-templates/padrao-ticketpraja.yml).
name: Padrão de PR

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  validar:
    name: Validar padrão do PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    steps:
      - name: Validar branch, título e vínculo com issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const base = pr.base.ref;
            const head = pr.head.ref;
            const padrao = context.payload.repository.default_branch;
            const erros = [];

            // Bots de dependência ficam de fora.
            if (pr.user.type === 'Bot') {
              core.info('PR aberto por bot — validação ignorada.');
              return;
            }

            // PR de release: development -> branch padrão.
            const release = head === 'development' && base === padrao;

            // 1. Branch de destino
            if (!release) {
              const hotfix = head.startsWith('hotfix/');
              if (hotfix && base !== padrao) {
                erros.push(`Branch hotfix/ deve apontar para "${padrao}", não para "${base}".`);
              }
              if (!hotfix && base !== 'development') {
                erros.push(`PRs devem apontar para "development" (destino atual: "${base}"). Só hotfix/ vai direto para "${padrao}".`);
              }
            }

            // 2. Nome da branch
            const reBranch = /^(feat|fix|chore|docs|refactor|test|hotfix)\/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$/;
            if (!release && !reBranch.test(head)) {
              erros.push(`Nome da branch "${head}" fora do padrão. Use tipo/NUMERO-descricao-curta, ex.: feat/123-cupom-por-lote.`);
            }

            // 3. Título
            const reTitulo = /^(feat|fix|chore|docs|refactor|test|perf|ci|build|revert|release)(\([a-z0-9-]+\))?!?: .{5,}$/;
            if (!reTitulo.test(pr.title)) {
              erros.push(`Título "${pr.title}" fora do padrão. Use tipo(escopo): descrição, ex.: feat(checkout): permite cupom por lote.`);
            }

            // 4. Vínculo com issue
            const reIssue = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i;
            if (!release && !reIssue.test(pr.body || '')) {
              erros.push('O corpo do PR precisa ter "Closes #NUMERO" apontando para a issue da tarefa.');
            }

            // 5. Número da branch = número da issue
            if (!release && reBranch.test(head)) {
              const numBranch = head.split('/')[1].split('-')[0];
              const refs = [...(pr.body || '').matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map(m => m[1]);
              if (refs.length && !refs.includes(numBranch)) {
                erros.push(`A branch cita a issue #${numBranch}, mas o corpo fecha ${refs.map(n => '#' + n).join(', ')}.`);
              }
            }

            if (erros.length) {
              core.summary.addHeading('PR fora do padrão', 2).addList(erros).addLink('Ver fluxo de desenvolvimento', 'https://github.com/Ticket-Pra-Ja/.github/blob/main/docs/governance/fluxo-de-desenvolvimento.md');
              await core.summary.write();
              core.setFailed(erros.join('\n'));
            } else {
              core.info('PR dentro do padrão.');
            }
