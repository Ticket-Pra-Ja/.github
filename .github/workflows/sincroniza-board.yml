# Move os cards do board de desenvolvimento (projeto 4). Lógica em scripts/sincroniza-board.js.
# Reutilizável: só roda quando um repositório o chama (ver workflow-templates/padrao-ticketpraja.yml).
# Requer os secrets TPJ_BOARD_APP_ID e TPJ_BOARD_APP_KEY; sem eles, só avisa e nunca bloqueia o PR.
name: Sincroniza board

on:
  workflow_call:
    secrets:
      TPJ_BOARD_APP_ID:
        required: false
      TPJ_BOARD_APP_KEY:
        required: false

permissions:
  contents: read

jobs:
  sincronizar:
    name: Sincronizar board
    runs-on: ubuntu-latest
    steps:
      - name: Verificar credenciais
        id: cred
        env:
          APP_ID: ${{ secrets.TPJ_BOARD_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::warning::Secrets do board não configurados; board não sincronizado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar token do GitHub App
        id: token
        if: steps.cred.outputs.ok == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TPJ_BOARD_APP_ID }}
          private-key: ${{ secrets.TPJ_BOARD_APP_KEY }}
          owner: Ticket-Pra-Ja

      - name: Baixar script
        if: steps.cred.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: Ticket-Pra-Ja/.github
          ref: main
          path: .tpj
          sparse-checkout: scripts

      - name: Atualizar status
        if: steps.cred.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.tpj/scripts/sincroniza-board.js`);
            await run({ github, context, core });

  # PR de release (development -> branch padrão): falha se algum card do repositório
  # ainda estiver em Homologação. Lógica em scripts/portao-release.js.
  portao-release:
    name: Portão de release
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.ref == 'development' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Gerar token do GitHub App
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TPJ_BOARD_APP_ID }}
          private-key: ${{ secrets.TPJ_BOARD_APP_KEY }}
          owner: Ticket-Pra-Ja

      - name: Baixar script
        uses: actions/checkout@v4
        with:
          repository: Ticket-Pra-Ja/.github
          ref: main
          path: .tpj
          sparse-checkout: scripts

      - name: Conferir aprovações
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.tpj/scripts/portao-release.js`);
            await run({ github, context, core });
